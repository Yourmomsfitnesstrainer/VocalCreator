alignment:
  backend: whisperx
  language: auto
  model: small
  device: auto
  compute_type: int8
  min_similarity: 0.62
  use_lyrics_prompt: true
  vad_filter: true
  vad_threshold: 0.30
  vad_min_silence_duration_ms: 1000
  vad_speech_pad_ms: 600
  context_seconds: 0.3
  max_window_seconds: 20.0
  score_thresholds: {}  # Per-model overrides; calibrate on training songs only
  align_models:
    ru: bond005/wav2vec2-base-ru

separation:
  enabled: auto
  backend: demucs
  model: htdemucs
  device: auto

pitch:
  backend: torchcrepe
  device: auto
  model: full
  hop_seconds: 0.01
  fmin: 65.0
  fmax: 1100.0
  periodicity_threshold: 0.32
  silence_db: -55.0
  batch_size: 1024

notes:
  min_note_seconds: 0.08
  max_gap_seconds: 0.055

piano:
  sample_rate: 44100
  attack_seconds: 0.008
  release_seconds: 0.18
  gain: 0.22
